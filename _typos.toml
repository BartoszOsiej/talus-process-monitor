# ── typos configuration ───────────────────────────────────────────────────
# NOTE: `_typos.toml` is the file the typos CLI loads preferentially when
# both it and `.typos.toml` exist — keep everything in THIS file.
#
# All mappings below are IDENTITY (word -> itself): they suppress the
# dictionary, they do not rewrite anything. Three groups:
#   1. Proper names / domain terms (theme names, WAD/BSP lump names…)
#   2. Short code identifiers in hot paths (loop vars, stat abbreviations)
#   3. Deliberate strings inside tests and demo fixtures (fuzzy-search
#      corpora, Levenshtein test data, truncated UI text)
[default.extend-words]
# ── proper names ──
ratatui = "ratatui"        # TUI library name (not "ratatouille")
hashi = "hashi"            # HashiCorp
darcula = "darcula"        # IntelliJ theme family name (not Dracula)
menas = "menas"            # theme-fixture author names
jaques = "jaques"          # Shakespeare character
vertexes = "vertexes"      # Doom WAD / Quake BSP lump name
worser = "worser"          # archaic English in bundled Shakespeare data
whilest = "whilest"
leafs = "leafs"            # BSP/Quake terminology (lump name)
unparseable = "unparseable" # valid variant; dictionary prefers "unparsable"
invokable = "invokable"

# ── code identifiers (short locals, stat abbreviations) ──
nd = "nd"
ba = "ba"
pn = "pn"
fo = "fo"
ths = "ths"
caf = "caf"
cll = "cll"
iy = "iy"
bck = "bck"
ment = "ment"
numer = "numer"            # numerator (paired with denom)
fpr = "fpr"                # false-positive rate (stats term, not "for")
inh = "inh"
strat = "strat"            # strategy shorthand
lik = "lik"
ist = "ist"
ful = "ful"
hel = "hel"
abd = "abd"
worl = "worl"
yhat = "yhat"              # statistics: predicted ŷ
sav = "sav"
helo = "helo"
yor = "yor"
halp = "halp"
dum = "dum"
ned = "ned"
seh = "seh"                # structured exception handling
ein = "ein"
tilda = "tilda"
ue = "ue"
erro = "erro"
