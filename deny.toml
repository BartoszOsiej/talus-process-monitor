[advisories]
version = 2
yanked = "warn"
ignore = [
    # Unmaintained transitive crates (via im 15 in ftui-runtime dev-deps and
    # build-only paths). No fixed versions exist upstream; not reachable from
    # production binaries. Revisit when ftui-runtime drops `im`.
    "RUSTSEC-2026-0247", # bitmaps (via im)
    "RUSTSEC-2026-0248", # im
    "RUSTSEC-2026-0251", # sized-chunks (via im)
    "RUSTSEC-2023-0126", # unwraps on client requests (build-only path)
    "RUSTSEC-2026-0255", # sized-chunks unsound (via im)
    # Patched in rustls 0.23.45+ / webpki 0.103.x — kept here only if an
    # older lockfile is audited; remove after CI confirms the update.
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
allow = [
    "MIT",
    # Workspace-internal crates carry a custom SPDX identifier
    # (MIT terms + attribution rider for AI-assisted code provenance).
    "LicenseRef-MIT-OpenAI-Anthropic-Rider",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "MPL-2.0",
    # Data license of the Knuth-Liang hyphenation pattern tables embedded
    # by the `hyphenation` crate (ftui-text font/shaping feature).
    "LPPL-1.3c",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
