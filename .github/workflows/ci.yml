name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (userspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - name: Run tests
        run: cargo test --verbose
      - name: Clippy
        run: cargo clippy -- -D warnings

  ebpf-build:
    name: Build kernel eBPF (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # nightly
        with:
          components: rust-src
      - name: Install bpf-linker (from source, matches nightly LLVM)
        run: cargo install bpf-linker --git https://github.com/alessandrod/bpf-linker --force
      - name: Fix libLLVM symlink (nightly linker scripts)
        run: |
          RUSTLIB_ROOT="$(rustc --print sysroot)"
          RUSTLIB="${RUSTLIB_ROOT}/lib"
          for f in "$RUSTLIB"/libLLVM-*-rust-*.so; do
            [ -f "$f" ] || continue
            SIZE="$(stat -c%s "$f" 2>/dev/null || echo 999999)"
            if [ "$SIZE" -lt 1024 ] 2>/dev/null; then
              REAL="$(grep -oP '(?<=INPUT\()[^)]+' "$f" 2>/dev/null || true)"
              if [ -n "$REAL" ] && [ -f "$RUSTLIB/$REAL" ]; then
                mv "$f" "${f}.script"
                ln -s "$REAL" "$f"
              fi
            fi
          done
      - name: Build eBPF (bpfel-unknown-none)
        run: |
          RUSTLIB_ROOT="$(rustc --print sysroot)"
          RUSTLIB="${RUSTLIB_ROOT}/lib"
          for f in "$RUSTLIB"/libLLVM.so.*; do
            [ -f "$f" ] || break
            LD_LIBRARY_PATH="$(dirname "$f"):$LD_LIBRARY_PATH"
            export LD_LIBRARY_PATH
            break
          done
          cargo +nightly build --profile bpf --target bpfel-unknown-none -Z build-std=core --manifest-path process-monitor-ebpf/Cargo.toml
