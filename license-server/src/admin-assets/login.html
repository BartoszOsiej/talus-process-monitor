<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Talus Admin — Sign in</title>
  <link rel="stylesheet" href="/admin/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🛰️</text></svg>" />
</head>
<body class="center">
  <main class="login-box">
    <div class="brand"><span class="logo">🛰️</span> Talus <b>License Admin</b></div>
    <form id="login-form">
      <label for="auth_code">Auth code</label>
      <input id="auth_code" type="password" autocomplete="current-password" required />
      <label for="totp">Two-factor code (Google Authenticator)</label>
      <input id="totp" inputmode="numeric" pattern="[0-9]*" maxlength="6"
             autocomplete="one-time-code" placeholder="000000" required />
      <button type="submit" id="login-btn">Sign in</button>
      <div id="login-error" class="result" role="alert"></div>
    </form>
    <p class="dim footnote">Two factors required: auth code + 6-digit TOTP.<br>
       Session expires after 12 hours.</p>
  </main>
  <script>
    // Minimal inline logic for the login view only — the main app JS is
    // loaded by the overview page after a successful sign-in.
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('login-error');
      btn.disabled = true; btn.textContent = 'Signing in…';
      err.textContent = '';
      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            auth_code: document.getElementById('auth_code').value,
            totp: document.getElementById('totp').value.trim(),
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.success) { location.replace('/admin'); return; }
        err.innerHTML = '<span class="bad">&#10007; ' +
          (data.message || ('sign-in failed (HTTP ' + res.status + ')')) + '</span>';
      } catch {
        err.innerHTML = '<span class="bad">&#10007; network error</span>';
      }
      btn.disabled = false; btn.textContent = 'Sign in';
    });
    const totpInput = document.getElementById('totp');
    totpInput.addEventListener('input', () => {
      totpInput.value = totpInput.value.replace(/[^0-9]/g, '');
    });
  </script>
</body>
</html>
