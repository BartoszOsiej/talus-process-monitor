<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Talus — License Admin</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🛰️</text></svg>" />
</head>
<body>
  <header>
    <div class="brand"><span class="logo">🛰️</span> Talus <b>License Admin</b></div>
    <div class="conn">
      <span id="upstream-label" class="dim"></span>
      <span id="health-dot" class="dot off" title="server health"></span>
    </div>
  </header>

  <main>
    <section id="stats" class="cards">
      <div class="card"><div class="k">Licenses seen</div><div class="v" id="s-licenses">–</div></div>
      <div class="card"><div class="k">Active seats</div><div class="v" id="s-activations">–</div></div>
      <div class="card"><div class="k">New seats (7d)</div><div class="v" id="s-7d">–</div></div>
      <div class="card"><div class="k">Revoked</div><div class="v" id="s-revoked">–</div></div>
    </section>

    <section class="panel">
      <h2>🔍 Lookup license</h2>
      <form id="lookup-form" class="row">
        <input id="lookup-id" placeholder="TALUS-XXXX-XXXX-XXXX" required />
        <button type="submit">Show activations</button>
      </form>
      <div id="lookup-result" class="result"></div>
    </section>

    <section class="panel danger">
      <h2>⚠️ Actions</h2>
      <form id="action-form" class="row wrap">
        <input id="action-id" placeholder="License ID" required />
        <select id="action-type">
          <option value="revoke">Revoke (blocks all, frees seats)</option>
          <option value="unrevoke">Restore (undo revoke)</option>
          <option value="free-seat">Free one seat (machine_id)</option>
        </select>
        <input id="action-machine" placeholder="machine_id (for free-seat)" />
        <input id="action-reason" placeholder="reason (for revoke)" />
        <button type="submit" id="action-btn" class="danger-btn">Execute</button>
      </form>
      <div id="action-result" class="result"></div>
    </section>

    <section class="panel">
      <h2>🕒 Recent activations</h2>
      <div class="table-wrap"><table id="recent-table">
        <thead><tr><th>License</th><th>Org</th><th>Tier</th><th>Machine</th><th>Host</th><th>Activated</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>

    <section class="panel">
      <h2>🚫 Revoked licenses</h2>
      <div class="table-wrap"><table id="revoked-table">
        <thead><tr><th>License</th><th>Org</th><th>Since</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>
  </main>

  <footer>
    <span class="dim">Local panel — the admin token never leaves this machine.</span>
    <button id="refresh">↻ Refresh</button>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
